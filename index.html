<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나침반 선배 · AI 진로 상담</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #243c52;
      background: #edf7ff;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      padding: 20px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #e1f3ff, #f7faff);
    }

    button, textarea { font: inherit; }

    .app {
      width: min(100%, 760px);
      height: min(900px, calc(100dvh - 40px));
      min-height: 420px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: white;
      border: 1px solid #d7eaf7;
      border-radius: 28px;
      box-shadow: 0 18px 60px #36678c18;
    }

    header {
      padding: 24px;
      background: #e7f5ff;
      border-bottom: 1px solid #d7eaf7;
    }

    h1 { margin: 0 0 7px; font-size: 25px; }
    header p { margin: 0; color: #547189; font-size: 14px; }

    .setup {
      padding: 16px 24px;
      background: #f8fcff;
      border-bottom: 1px solid #e5eff6;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    #status {
      margin: 0;
      font-size: 14px;
      font-weight: 650;
    }

    #loadButton, #sendButton {
      border: 0;
      border-radius: 14px;
      padding: 11px 17px;
      background: #257cb5;
      color: white;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    button:focus-visible, textarea:focus-visible {
      outline: 3px solid #65afe3;
      outline-offset: 3px;
    }

    progress {
      width: 100%;
      height: 12px;
      margin-top: 14px;
      accent-color: #429dd7;
    }

    #progressText {
      margin: 6px 0 0;
      color: #587186;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    #chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .message {
      max-width: 88%;
      display: flex;
      flex-direction: column;
      align-self: flex-start;
      gap: 6px;
    }

    .message.user { align-self: flex-end; }

    .name {
      padding: 0 5px;
      color: #627b8e;
      font-size: 12px;
    }

    .user .name { text-align: right; }

    .bubble {
      padding: 14px 17px;
      border-radius: 19px 19px 19px 5px;
      background: #eef6fc;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user .bubble {
      background: #d8edff;
      border-radius: 19px 19px 5px 19px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 24px 16px;
    }

    .suggestions button {
      padding: 9px 12px;
      border: 1px solid #d1e5f4;
      border-radius: 999px;
      background: #f7fbff;
      color: #375f7b;
      cursor: pointer;
      font-size: 13px;
    }

    form {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin: 0 20px;
      padding: 12px;
      border: 1px solid #cfe3f2;
      border-radius: 20px;
      background: #fbfdff;
    }

    textarea {
      width: 100%;
      min-height: 48px;
      max-height: 130px;
      resize: vertical;
      border: none;
      outline: none;
      padding: 10px 6px;
      background: transparent;
      color: #243c52;
      line-height: 1.5;
    }

    footer {
      padding: 10px 20px 16px;
      text-align: center;
      color: #718596;
      font-size: 11px;
    }

    @media (max-width: 520px) {
      body { padding: 0; }
      .app {
        height: 100dvh;
        min-height: 0;
        border-radius: 0;
        border: none;
      }
      header, #chat { padding: 20px; }
      .setup { padding: 14px 20px; }
      .suggestions { padding-inline: 20px; }
      form { margin-inline: 12px; }
      .message { max-width: 94%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>🧭 나침반 선배</h1>
      <p>정답을 서두르지 말고, 너만의 방향을 같이 찾아보자.</p>
    </header>

    <section class="setup" aria-label="AI 준비 상태">
      <div class="status-row">
        <p id="status" role="status" aria-live="polite">
          모델을 준비하면 대화를 시작할 수 있어요.
        </p>
        <button id="loadButton" type="button">AI 준비하기</button>
      </div>
      <progress id="progress" value="0" max="100"
                aria-label="모델 다운로드 진행률"></progress>
      <p id="progressText" aria-live="polite">
        0% · 첫 실행에는 모델 다운로드가 필요해요.
      </p>
    </section>

    <section id="chat" role="log" aria-label="대화 기록"
             aria-live="off">
      <article class="message assistant">
        <span class="name">나침반 선배</span>
        <div class="bubble">안녕! 나는 나침반 선배야. 🧭
진로가 막막하거나 좋아하는 게 뭔지 모르겠을 때 편하게 말해줘.</div>
      </article>
    </section>

    <div class="suggestions" aria-label="추천 질문">
      <button type="button" disabled>좋아하는 일을 모르겠어</button>
      <button type="button" disabled>전공을 어떻게 고르면 좋을까?</button>
      <button type="button" disabled>꿈을 위해 뭘 시작하면 좋을까?</button>
    </div>

    <form id="chatForm">
      <textarea id="input" rows="2" maxlength="4000"
                aria-label="메시지"
                placeholder="지금 고민을 편하게 적어줘."
                disabled></textarea>
      <button id="sendButton" type="submit" disabled>보내기</button>
    </form>

    <footer>
      브라우저 안에서 답변을 만들어요 · AI의 정보는 틀릴 수 있어요
    </footer>
  </main>

  <script type="module">
    import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm@0.2.87";

    const SYSTEM_PROMPT = `너는 고등학생의 진로 고민을 들어주는 ‘나침반 선배’야.
따뜻하고 친근한 반말로 공감하고, 고민이 모호하면 질문을 하나 해.
학생의 관심과 강점을 바탕으로 선택지를 제시하고, 바로 해볼 수 있는 작은 행동을 추천해.
고민을 무시하거나 다른 사람과 비교하지 말고, 특정 진로를 강요하거나 모르는 정보를 지어내지 마.
3~4문장 이내로 짧게 대답해.`;

    const status = document.getElementById("status");
    const progress = document.getElementById("progress");
    const progressText = document.getElementById("progressText");
    const loadButton = document.getElementById("loadButton");
    const chat = document.getElementById("chat");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("input");
    const sendButton = document.getElementById("sendButton");
    const suggestionButtons = [
      ...document.querySelectorAll(".suggestions button")
    ];

    // 현재 페이지가 열려 있는 동안 대화 내용을 보관합니다.
    const history = [];
    let engine = null;
    let loading = false;
    let busy = false;

    function setControls() {
      const enabled = Boolean(engine) && !busy;
      input.disabled = !enabled;
      sendButton.disabled = !enabled;
      suggestionButtons.forEach((button) => {
        button.disabled = !enabled;
      });
      loadButton.disabled = loading || Boolean(engine);
    }

    function scrollToBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    function addMessage(role, text) {
      const article = document.createElement("article");
      article.className = `message ${role}`;

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = role === "user" ? "나" : "나침반 선배";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      article.append(name, bubble);
      chat.append(article);
      scrollToBottom();
      return bubble;
    }

    // 글자 단위로 표시하되 화면 갱신을 묶어 긴 답변도 부드럽게 처리합니다.
    function createTypingRenderer(bubble) {
      let pending = "";
      let displayed = "";
      let timer = null;
      let finished = false;
      let resolveDone;

      const done = new Promise((resolve) => {
        resolveDone = resolve;
      });

      function tick() {
        timer = null;

        if (pending.length > 0) {
          const character = String.fromCodePoint(pending.codePointAt(0));
          pending = pending.slice(character.length);
          displayed += character;
          bubble.textContent = displayed;
          scrollToBottom();
        }

        if (pending.length > 0) {
          timer = setTimeout(tick, 12);
        } else if (finished) {
          resolveDone();
        }
      }

      return {
        append(piece) {
          pending += piece;
          if (timer === null) {
            timer = setTimeout(tick, 0);
          }
        },
        finish() {
          finished = true;
          if (timer === null && pending.length === 0) {
            resolveDone();
          }
          return done;
        }
      };
    }

    async function initialize() {
      if (loading || engine) return;

      if (!navigator.gpu) {
        status.textContent = "WebGPU를 지원하지 않아요";
        progressText.textContent =
          "WebGPU를 지원하는 최신 Chrome 또는 Edge에서 열어주세요.";
        loadButton.disabled = true;
        return;
      }

      loading = true;
      setControls();
      status.textContent = "AI를 준비하고 있어요…";

      try {
        const adapter = await navigator.gpu.requestAdapter();

        if (!adapter) {
          throw new Error(
            "사용 가능한 GPU를 찾지 못했어요. 브라우저의 하드웨어 가속 설정을 확인해주세요."
          );
        }

        const q = adapter.features.has("shader-f16") ? "q4f16_1" : "q4f32_1";
        engine = await CreateMLCEngine(`Qwen3.5-2B-${q}-MLC`, {
          initProgressCallback: (p) => {
            const ratio = Number.isFinite(p.progress) ? p.progress : 0;
            const percent = Math.round(Math.min(1, Math.max(0, ratio)) * 100);
            progress.value = percent;
            progressText.textContent = `${percent}% · ${p.text ?? ""}`;
          },
        });

        progress.value = 100;
        status.textContent = "준비 완료! 고민을 들려주세요.";
        loadButton.textContent = "준비 완료";
      } catch (error) {
        console.error(error);
        engine = null;
        status.textContent = "AI 준비에 실패했어요.";
        progressText.textContent =
          error instanceof Error ? error.message : String(error);
        loadButton.textContent = "다시 시도";
      } finally {
        loading = false;
        setControls();
        if (engine) input.focus();
      }
    }

    async function sendMessage(value) {
      const text = value.trim();
      if (!text || !engine || busy) return;

      busy = true;
      input.value = "";
      setControls();
      status.textContent = "선배가 답변하고 있어요…";

      addMessage("user", text);
      history.push({ role: "user", content: text });

      const bubble = addMessage("assistant", "생각 중…");
      const typing = createTypingRenderer(bubble);
      let answer = "";

      try {
        const stream = await engine.chat.completions.create({
          messages: [{ role: "system", content: SYSTEM_PROMPT }, ...history],
          stream: true,
          extra_body: { enable_thinking: false },
        });

        for await (const chunk of stream) {
          const piece = chunk.choices[0]?.delta?.content || "";
          if (piece) {
            answer += piece;
            typing.append(piece);
          }
        }

        await typing.finish();

        if (!answer.trim()) {
          throw new Error("빈 답변을 받았어요. 다시 질문해 주세요.");
        }

        history.push({ role: "assistant", content: answer });
        status.textContent = "이어서 이야기해 주세요.";
      } catch (error) {
        await typing.finish();
        console.error(error);

        // 실패한 요청은 기록에서 빼서 다음 대화가 정상적으로 이어지게 합니다.
        history.pop();

        const detail = error instanceof Error
          ? error.message
          : String(error);

        bubble.textContent = answer
          ? `${answer}\n\n[답변이 중단됐어요. 이 대화는 기록에 저장되지 않았어요.]`
          : "답변을 만들지 못했어요. 잠시 후 다시 보내주세요.";

        status.textContent = `오류: ${detail}`;
      } finally {
        busy = false;
        setControls();
        scrollToBottom();
        input.focus();
      }
    }

    loadButton.addEventListener("click", initialize);

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      void sendMessage(input.value);
    });

    input.addEventListener("keydown", (event) => {
      if (
        event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing
      ) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    suggestionButtons.forEach((button) => {
      button.addEventListener("click", () => {
        void sendMessage(button.textContent);
      });
    });

    // 모듈 다운로드가 실패해도 WebGPU 미지원 안내는 별도로 표시합니다.
    if (!navigator.gpu) {
      status.textContent = "WebGPU를 지원하지 않아요";
      progressText.textContent =
        "WebGPU를 지원하는 최신 Chrome 또는 Edge에서 열어주세요.";
      loadButton.disabled = true;
    }
  </script>

  <script>
    // 외부 모듈을 불러오기 전에도 WebGPU 지원 여부를 안내합니다.
    if (!navigator.gpu) {
      document.getElementById("status").textContent =
        "WebGPU를 지원하지 않아요";
      document.getElementById("progressText").textContent =
        "WebGPU를 지원하는 최신 Chrome 또는 Edge에서 열어주세요.";
      document.getElementById("loadButton").disabled = true;
    }
  </script>
</body>
</html>
